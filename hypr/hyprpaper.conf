# hyprpaper 配置（0.8.x 新语法）
wallpaper {
    monitor  = DP-1
    # Absolute path required — hyprpaper cannot expand $HOME.
    # install.sh copies assets/wallpaper.jpg to ~/Pictures/ and rewrites this to your home.
    path     = /home/wjf/Pictures/wallhaven-jev9xw.jpg
    fit_mode = fill
}

splash = false
ipc = true
