# 空闲管理：10 分钟自动锁屏
general {
    lock_cmd = pidof hyprlock || hyprlock        # 避免重复锁定
    before_sleep_cmd = pidof hyprlock || hyprlock
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 600                                # 10 分钟无输入
    on-timeout = pidof hyprlock || hyprlock
}
